databases:
  - name: filetransfer-db
    plan: free

services:
  - type: web
    name: file-transfer-app
    env: node
    plan: free
    buildCommand: npm i express multer uuid socket.io pg
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: filetransfer-db
          property: connectionString